- type: alignment
  id: LawfulGood
  name: Законопослушный добрый
  description: "[bold]'Справедливость'[/bold]\n\nИзгоняйте зло через высшую власть.\nВы верите, что закон и порядок — лучший способ помогать другим."
  effects:
    - TraitLawfulGood

- type: alignment
  id: Good
  name: Добрый
  description: "[bold]'Умеренность'[/bold]\n\nИсцеляйте вселенную добротой.\nУ вас есть сильное убеждение помогать другим, чего бы это ни стоило."
  effects:
    - TraitGood

- type: alignment
  id: ChaoticGood
  name: Хаотично добрый
  description: "[bold]'Сила'[/bold]\n\nОсвободите других от зла.\nВы верите, что свобода от тирании — лучший способ помогать другим."
  effects:
    - TraitChaoticGood

- type: alignment
  id: Lawful
  name: Законопослушный
  description: "[bold]'Колесница'[/bold]\n\nПриведите вселенную в порядок.\nВы цените закон и хорошо упорядоченное общество превыше всего."
  effects:
    - TraitLawful

- type: alignment
  id: TrueNeutral
  name: Истинно нейтральный
  description: "[bold]'Отшельник'[/bold]\n\nВо всём — срединный путь.\nУ вас нет сильных предпочтений между законом и свободой, и вы не идёте из своего пути, чтобы помочь или навредить другим."
  effects:
    - TraitNeutral

- type: alignment
  id: Chaotic
  name: Хаотичный
  description: "[bold]'Луна'[/bold]\n\nОсвободите себя от всех обязательств.\nВы цените свою личную свободу превыше всего."
  effects:
    - TraitChaotic

- type: alignment
  id: LawfulEvil
  name: Законопослушный злой
  description: "[bold]'Император'[/bold]\n\nПравьте другими железным кулаком.\nВы верите, что порядок и иерархия — инструменты для вашей личной выгоды."
  effects:
    - TraitLawfulEvil

- type: alignment
  id: Evil
  name: Злой
  description: "[bold]'Смерть'[/bold]\n\nСтавьте себя превыше всех остальных.\nУ вас нет истинного уважения к другим, и вы действуете только ради собственной выгоды."
  effects:
    - TraitEvil

- type: alignment
  id: ChaoticEvil
  name: Хаотично злой
  description: "[bold]'Дьявол'[/bold]\n\nСвобода любой ценой.\nВы ненавидите власть и будете искать свободу и личное удовлетворение, даже когда это вредит другим."
  effects:
    - TraitChaoticEvil