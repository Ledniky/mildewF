- type: turningPoint
  id: ChosenByAuthority
  name: Избран для Нексуса
  description: "Правящая власть в вашем секторе выбрала вас для отправки в [bold]Пространство Нексуса[/bold].\nВы должны разорвать формальные связи, так как [bold]NCC[/bold] требует, чтобы каждый, кто входит в [bold]Пространство Нексуса[/bold], делал это как независимый."
  effects:
    - TraitPledge

- type: turningPoint
  id: FellFromGrace
  name: Внезапно в опале
  description: "Когда ваша репутация у местных властей испортилась, вам пришлось бежать в [bold]Пространство Нексуса[/bold].\nБлагодаря [bold]NCC[/bold] и [italic]Перемирию независимых[/italic] вы знаете, что ваши преследователи не смогут последовать за вами в [bold]Пространство Нексуса[/bold]."
  effects:
    - TraitPledge

- type: turningPoint
  id: Magician
  name: Встреча с Магом
  description: "Вы встретили странного путешественника из-за пределов вашей Вселенной.\nОн назвал себя [color=gray]Магом[/color] и убедил вас отправиться в [bold]Пространство Нексуса[/bold].\nВы оставили всё позади, чтобы следовать этой Судьбе."
  effects:
    - TraitPledge

- type: turningPoint
  id: Priestess
  name: Воодушевление от Жрицы
  description: "Вы встретили мудрую [color=yellow]Жрицу[/color], которая знала многие секреты Порога.\nОна воодушевила вас отправиться в [bold]Пространство Нексуса[/bold] на поиски Богов.\nВы оставили всё позади, чтобы следовать этой Судьбе."
  effects:
    - TraitPledge

- type: turningPoint
  id: Rational
  name: Лекция от Рационалиста
  description: "Гениальный рационалист прочитал лекцию в вашем секторе.\nОн сказал, что всё в Пороге можно объяснить наукой, проводимой в [bold]Пространстве Нексуса[/bold].\nВы оставили всё позади, чтобы следовать этой Судьбе."
  effects:
    - TraitPledge