- type: motive
  id: Wealth
  name: Богатство
  description: "Порог предлагает обещание вечных богатств тем, кто достаточно смел, чтобы их захватить."
  effects:
    - MotiveWealth

- type: motive
  id: Power
  name: Власть
  description: "Вы устали подчиняться чужой власти. Внутри Порога вы построите свой идеальный мир."
  effects:
    - MotivePower

- type: motive
  id: SecretKnowledge
  name: Тайные знания
  description: "Последние рубежи науки могут быть скрыты внутри Порога. Вы намерены их обнаружить."
  effects:
    - MotiveSecretKnowledge

- type: motive
  id: Friendship
  name: Дружба
  description: "Вы хотите, чтобы вас любили и знали многих людей."
  effects:
    - MotiveFriendship

- type: motive
  id: Enlightenment
  name: Просветление
  description: "Ходят слухи, что Боги из другой вселенной обитают на краях Порога."
  effects:
    - MotiveEnlightenment