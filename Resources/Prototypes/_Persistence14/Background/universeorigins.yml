- type: universeOrigin
  id: Zenith
  name: Вселенная Зенит
  description: "Порог во Вселенной Зенит контролируется Солнечным Легионом.\nКолонистов в Порог доставляют Солнечный Легион и Nanotrasen.\n[italic]Это подходящий выбор для персонажей из прошлых итераций Persistence 14."
  effects:
    - TraitOriginZenith

- type: universeOrigin
  id: Green
  name: Зелёная Вселенная
  description: "Порог в Зелёной Вселенной контролируется Nanotrasen.\nNanotrasen платит людям, чтобы они вошли в Порог в качестве колонистов.\n[italic]Это подходящий выбор для традиционных персонажей SS14."
  effects:
    - TraitOriginGreen

- type: universeOrigin
  id: Marine
  name: Вселенная Морпехов
  description: "Порог во Вселенной Морпехов оспаривается между Объединёнными Нациями и бесконечной ордой враждебных пришельцев.\nКолонистов втягивают в Порог для поддержки конфликта.\n[italic]Это подходящий выбор для персонажей RMC."
  effects:
    - TraitOriginMarine

- type: universeOrigin
  id: Precursor
  name: Вселенная Предтеч
  description: "Порог во Вселенной Предтеч контролируется группой корпораций, которая называет себя 'Синдикат'.\nКолонистов заманивают в Порог схемами Синдиката.\n[italic]Это подходящий выбор для плутоватых персонажей."
  effects:
    - TraitOriginPrecursor

- type: universeOrigin
  id: Shadow
  name: Теневая Вселенная
  description: "Порог в Теневой Вселенной контролируется безликими, злонамеренными сущностями, которые манипулируют смертными, чтобы те выполняли их волю.\nКолонистов обманом заставляют войти в Порог происками Теневых Сущностей.\n[italic]Это необычное происхождение."
  effects:
    - TraitOriginShadow